<!doctype html>
<!--
  Janjiwangi poster for the project card. 1600×1000, rendered at 2x by ../render.mjs:
    node design/posters/render.mjs design/posters/janjiwangi/janjiwangi.html public/images/projects/janjiwangi-poster.webp
  Images in this folder (screenshots of the live store): home.webp, product.webp, phone.webp, wordmark.png.
  Same layout as the KABO poster, in the store's own orange.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Janjiwangi poster</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;800&family=Plus+Jakarta+Sans:wght@600&display=block" rel="stylesheet" />
<style>
  :root { --orange: #ff8a1f; --peach: #ffb38a; --ink: #2a160a; --muted: #7a5a44; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 1000px; }
  body {
    position: relative; overflow: hidden; background: #fffaf5;
    font-family: "Plus Jakarta Sans", sans-serif; color: var(--ink);
  }

  /* Backdrop: warm orange glow top right, a peach blush bottom left, dot grid behind the words */
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); }
  .glow.orange { width: 1100px; height: 900px; right: -260px; top: -380px; background: var(--orange); opacity: .45; }
  .glow.peach { width: 700px; height: 600px; left: -260px; bottom: -330px; background: var(--peach); opacity: .45; }
  .grid {
    position: absolute; inset: 0;
    background: radial-gradient(rgb(42 22 10 / .1) 1.2px, transparent 1.6px) 0 0 / 26px 26px;
    -webkit-mask-image: linear-gradient(90deg, #000 40%, transparent 70%);
  }

  /* Words */
  .copy { position: absolute; left: 96px; top: 118px; width: 640px; }
  .kicker { display: flex; align-items: center; gap: 18px; font-weight: 600; font-size: 24px; color: var(--muted); }
  .kicker img { height: 46px; border-radius: 12px; }
  h1 { margin-top: 40px; font: 800 124px/.85 Geist, sans-serif; letter-spacing: -0.06em; }
  .pitch { margin-top: 44px; max-width: 560px; font: 600 44px/1.12 Geist, sans-serif; letter-spacing: -0.025em; }
  .pitch em { font-style: normal; color: #f26b00; }
  .tags { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 12px; max-width: 520px; }
  .tags span { padding: 10px 20px; border-radius: 999px; background: #fff; border: 2px solid rgb(42 22 10 / .1); font-weight: 600; font-size: 21px; }

  /* Home page in a browser window, running off the right edge */
  .browser {
    position: absolute; left: 780px; top: 120px; width: 1040px; overflow: hidden;
    border-radius: 22px; background: #fff;
    box-shadow: 0 40px 90px rgb(42 22 10 / .2), 0 0 0 1px rgb(42 22 10 / .06);
  }
  .bar { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 22px; background: #fbf3ec; }
  .bar i { width: 14px; height: 14px; border-radius: 50%; background: #ead9cb; }
  .bar i:first-child { background: var(--orange); }
  .bar span { margin-left: 18px; padding: 6px 18px; border-radius: 999px; background: #fff; font-weight: 600; font-size: 18px; color: var(--muted); }
  .browser img { display: block; width: 100%; }

  /* Product page: the bottle and the buy box */
  .product {
    position: absolute; left: 1010px; top: 640px; width: 680px; height: 310px; border-radius: 22px;
    background: #fff url(product.webp) 0 0 / 100% auto no-repeat;
    box-shadow: 0 30px 70px rgb(42 22 10 / .22), 0 0 0 1px rgb(42 22 10 / .06);
  }

  /* The store on a phone */
  .phone {
    position: absolute; left: 680px; top: 470px; width: 320px; height: 556px;
    padding: 12px; border-radius: 50px; background: #1d140e;
    box-shadow: 0 40px 70px rgb(42 22 10 / .3);
    transform: rotate(-4deg);
  }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 39px; }
  .phone::before {
    content: ""; position: absolute; left: 50%; top: 22px; width: 84px; height: 24px;
    margin-left: -42px; border-radius: 999px; background: #1d140e; z-index: 1;
  }
</style>
</head>
<body>
  <div class="glow orange"></div>
  <div class="glow peach"></div>
  <div class="grid"></div>

  <div class="copy">
    <p class="kicker"><img src="wordmark.png" alt="" />Shopify store</p>
    <h1>Janjiwangi</h1>
    <p class="pitch">A <em>playful</em> online store for a Malaysian fragrance brand.</p>
    <div class="tags"><span>Shopify</span><span>Liquid</span><span>GraphQL</span><span>JavaScript</span></div>
  </div>

  <div class="browser">
    <div class="bar"><i></i><i></i><i></i><span>janjiwangi</span></div>
    <img src="home.webp" alt="" />
  </div>
  <div class="product"></div>
  <div class="phone"><img src="phone.webp" alt="" /></div>
</body>
</html>
